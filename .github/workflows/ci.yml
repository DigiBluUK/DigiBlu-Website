name: CI

# Runs on every push and pull request to the two long-lived branches: the
# build-time script tests, the Next.js build, and the Cloudflare Worker
# bundle. A red run here means Cloudflare would fail to deploy the same
# commit, so it is caught before it gets there.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_ROBOTS: noindex
      # Over the prerendered output: metadata, canonicals, share-card files,
      # the listing pages' content and the sitemap (11 Sep 2026).
      - run: npm run test:pages
      - run: npm run build:cf
        env:
          NEXT_PUBLIC_ROBOTS: noindex
